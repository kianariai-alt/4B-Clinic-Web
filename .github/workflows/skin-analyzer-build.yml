name: Build 4B Skin Analyzer Android
on:
  push:
    branches: ["feature/skin-analyzer-v2-build"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build installable debug APK
        working-directory: skin-analyzer/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: 4B-Skin-Analyzer-v2-debug-APK
          path: skin-analyzer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
