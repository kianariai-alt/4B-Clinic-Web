name: 4B Skin Android Emulator Smoke Test
on:
  push:
    branches: ["feature/skin-analyzer-v2-build"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download APK built from current v2 branch
        uses: actions/download-artifact@v4
        with:
          run-id: 42456214290
          github-token: ${{ github.token }}
          name: 4B-Skin-Analyzer-v2-installable-APK
          path: /tmp/skin-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p /tmp/skin-test
            adb install -r /tmp/skin-apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.fourb.skinanalyzer/.MainActivity | tee /tmp/skin-test/launch.txt
            sleep 12
            adb shell pidof com.fourb.skinanalyzer > /tmp/skin-test/pid.txt || true
            adb exec-out screencap -p > /tmp/skin-test/screen.png || true
            adb logcat -d -v time > /tmp/skin-test/logcat.txt
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml /tmp/skin-test/window.xml || true
            echo "Process: $(cat /tmp/skin-test/pid.txt)"
            echo "Fatal log excerpts:"
            grep -in -A 20 -B 4 'FATAL EXCEPTION\|AndroidRuntime\|crash' /tmp/skin-test/logcat.txt | tail -120 || true
            test -s /tmp/skin-test/pid.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skin-android-emulator-diagnostics
          path: /tmp/skin-test/
          if-no-files-found: warn
          retention-days: 7
